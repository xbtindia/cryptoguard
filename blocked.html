<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blocked by CryptoGuard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0b0e14;
      color: #e5e7eb;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }
    .card {
      background: #111827;
      border: 1px solid #374151;
      border-radius: 16px;
      padding: 40px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }
    .shield {
      font-size: 56px;
      margin-bottom: 16px;
      display: block;
      filter: drop-shadow(0 0 10px #ef4444);
    }
    h1 {
      font-size: 22px;
      margin-bottom: 8px;
      color: #ef4444;
    }
    p {
      color: #9ca3af;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 20px;
    }
    .url {
      background: #1f2937;
      padding: 8px 14px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 13px;
      color: #e5e7eb;
      word-break: break-all;
      margin-bottom: 20px;
      border: 1px solid #374151;
    }
    .btn {
      display: inline-block;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }
    .btn-primary {
      background: linear-gradient(135deg, #059669, #10b981);
      color: white;
      margin-right: 8px;
    }
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
    }
    .btn-secondary {
      background: #1f2937;
      color: #9ca3af;
      border: 1px solid #374151;
    }
    .btn-secondary:hover {
      background: #374151;
      color: #e5e7eb;
    }
    .footer {
      margin-top: 24px;
      font-size: 11px;
      color: #4b5563;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="shield">&#128737;</span>
    <h1>Access Blocked</h1>
    <p>CryptoGuard has blocked this site to protect your assets. Only verified crypto wallet sites are permitted.</p>
    <div class="url" id="blockedUrl">Unknown URL</div>
    <div>
      <button class="btn btn-primary" onclick="goBack()">Go Back</button>
      <button class="btn btn-secondary" onclick="openExtension()">Open CryptoGuard</button>
    </div>
    <div class="footer">If you believe this is an official site, add it via the extension popup.</div>
  </div>

  <script>
    // Report this block to background for counter (works on Android too)
    try {
      chrome.runtime.sendMessage({ action: 'reportBlocked' });
    } catch (e) {}

    const params = new URLSearchParams(window.location.search);
    const url = params.get('url');
    if (url) {
      document.getElementById('blockedUrl').textContent = decodeURIComponent(url);
    }
    function goBack() { history.back(); }
    function openExtension() {
      try {
        chrome.runtime.sendMessage({ action: 'openPopup' });
      } catch (e) {
        alert('Please tap the CryptoGuard icon in your browser toolbar.');
      }
    }
  </script>
</body>
</html>
